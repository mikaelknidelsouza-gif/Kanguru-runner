function box(o){return {x:o.x+3,y:G-o.h+3-(o.hop||0),w:o.w-6,h:o.h-4}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(){
  if(state==='paused')return;
  s.t++;if(s.lt>0)s.lt--;
  se=seas();
  if(state!=='run')return;
  s.dist+=s.speed*.16;s.speed=Math.min(9.5,4.8+.35*Math.floor(s.dist/200));s.off+=s.speed;
  s.vy+=.8;s.y+=s.vy;if(s.y>=G-52){s.y=G-52;s.vy=0}
  var bb=bio();
  if(s.lb!==bb.a||s.ls!==se.i){s.lb=bb.a;s.ls=se.i;s.label=B[bb.a].n+', '+SE[se.i].n;s.lt=110}
  var pc=SE[se.i].p;
  if(pc&&s.t%5===0&&s.pt.length<60)s.pt.push({x:Math.random()*(W+100),y:-6,vy:se.i===3?1.4:1.8,vx:-s.speed*.35-Math.random(),c:pc});
  for(var j=s.pt.length-1;j>=0;j--){var p=s.pt[j];p.x+=p.vx;p.y+=p.vy;if(p.y>G+30||p.x<-10)s.pt.splice(j,1)}
  s.gap-=s.speed;
  if(s.gap<=0){
    var L=OB[bb.t>.5?bb.b:bb.a],wantA=Math.random()<.12&&!s.lastA,pool=L.filter(function(q){return wantA?q[3]:!q[3]}),d=pool[(Math.random()*pool.length)|0];
    s.lastA=!!d[3];
    s.obs.push({t:d[0],x:W+20,w:d[1],h:d[2],an:d[3],hop:0});
    s.gap=280+Math.random()*240+s.speed*16;
  }
  var rb={x:22,y:s.y+4,w:30,h:46};
  for(var i=s.obs.length-1;i>=0;i--){
    var o=s.obs[i];o.x-=s.speed+(o.an?s.speed*.25:0);
    if(o.t==='rabbit')o.hop=Math.abs(Math.sin(s.t/6))*16;
    if(o.x<-80){s.obs.splice(i,1);continue}
    if(hit(rb,box(o))){
      state='over';s.t=0;var sc=Math.floor(s.dist);
      if(sc>best){best=sc;try{localStorage.setItem('rooBest',best)}catch(e){}}
      menu('Fim de jogo','Pontos: '+sc+(sc>=best?' (novo recorde!)':'')+'. Recorde: '+best,'Jogar de novo',play);
    }
  }
}
function pad(n){return ('00000'+n).slice(-5)}

  C('#000');ctx.globalAlpha=.18;R(0,G,W,3);
  for(var i=0;i<16;i++){var gx=((i*53-s.off)%W+W)%W;R(gx,G+16+(i%3)*10,12+(i%4)*5,3)}

  s.obs.forEach(function(o){ctx.save();if(o.hop)ctx.translate(0,-o.hop);drawOb(o);ctx.restore()});

  C('#2c1a0e');ctx.font='bold 16px "Trebuchet MS",sans-serif';ctx.textAlign='right';
  ctx.fillText('Recorde '+pad(best)+'   '+pad(Math.floor(s.dist))+' pts',W-12,26);
  if(s.lt>0&&state==='run'){ctx.textAlign='center';ctx.globalAlpha=Math.min(1,s.lt/30);ctx.font='bold 22px "Trebuchet MS",sans-serif';ctx.fillText(s.label,W/2,60);ctx.globalAlpha=1}
}
function loop(){update();draw();requestAnimationFrame(loop)}
menu('Canguru Runner','Pule os obstáculos e atravesse deserto, floresta, campos e vila.','Jogar',play);
loop();
})();
